services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: stardist-base
    container_name: stardist-jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      JUPYTER_TOKEN: stardist
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    restart: unless-stopped

  api:
    image: stardist-base
    container_name: stardist-api
    command: uvicorn api:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      STARDIST_MAX_TILE_SIZE: 1024
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    restart: unless-stopped